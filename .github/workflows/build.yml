name: Build pdx206 NetHunter kernel

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio rsync python3 zip curl git make device-tree-compiler \
            clang lld llvm

      - name: Check compiler
        run: |
          clang --version
          ld.lld --version

      - name: Fetch pinned Lineage kernel source
        run: |
          git clone --depth=1 --branch lineage-23.2 \
            https://github.com/LineageOS/android_kernel_sony_sm8250.git \
            kernel
          test "$(git -C kernel rev-parse --short=12 HEAD)" = "7fc8455b2fa8"

      - name: Verify device configuration files
        run: |
          test -f kernel/arch/arm64/configs/vendor/kona-perf_defconfig
          test -f kernel/arch/arm64/configs/vendor/edo.config
          test -f kernel/arch/arm64/configs/vendor/pdx206.config

      - name: Patch Kconfig to disable QCA WiFi (fixes HTC symbol conflict)
        run: |
          set -euo pipefail
          # Patch the wireless Kconfig to prevent WLAN from auto-selecting QCA vendor
          # This is needed because CONFIG_WLAN selects WLAN_VENDOR_SELECT which
          # auto-enables WLAN_VENDOR_QCA, causing HTC symbol conflicts with ath9k
          if [ -f kernel/drivers/net/wireless/Kconfig ]; then
            echo "Patching kernel Kconfig to disable QCA WiFi auto-selection..."
            # Comment out lines that select WLAN_VENDOR_QCA under WLAN
            sed -i 's/^config WLAN_VENDOR_QCA$/#config WLAN_VENDOR_QCA/' kernel/drivers/net/wireless/Kconfig
          fi
          if [ -f kernel/drivers/staging/qca-wifi-host-cmn/Kconfig ]; then
            # Disable all QCA staging Kconfig entries
            sed -i 's/^config .*/#config &/' kernel/drivers/staging/qca-wifi-host-cmn/Kconfig
          fi

      - name: Configure and build kernel
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          mkdir -p out
          clang --version

          # Start with base defconfig
          echo "Creating base configuration..."
          make -C kernel O="$PWD/out" vendor/kona-perf_defconfig

          # Merge device-specific configs (trimmed to remove QCA)
          grep -v 'CONFIG_QCA_' kernel/arch/arm64/configs/vendor/pdx206.config > out/.config.pdx206 2>/dev/null || cp kernel/arch/arm64/configs/vendor/pdx206.config out/.config.pdx206
          grep -v 'CONFIG_QCA_' kernel/arch/arm64/configs/vendor/edo.config > out/.config.edo 2>/dev/null || cp kernel/arch/arm64/configs/vendor/edo.config out/.config.edo
          cat out/.config.edo out/.config.pdx206 >> out/.config

          # Add NetHunter packet injection & deauth support
          cat >> out/.config <<'NETHUNTER'
          # NetHunter WiFi drivers with packet injection support
          CONFIG_MAC80211=y
          CONFIG_WLAN=y
          # MT76 USB wireless drivers
          CONFIG_MT76_CORE=y
          CONFIG_MT76x02_LIB=y
          CONFIG_MT76x0U=y
          CONFIG_MT76x2U=y
          # Ralink RT2800 USB drivers (packet injection support)
          CONFIG_RT2X00=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_RT2X00_LIB=y
          CONFIG_RT2X00_LIB_FIRMWARE=y
          # Atheros AR9001/AR9002 USB drivers (packet injection support)
          CONFIG_ATH_COMMON=y
          CONFIG_ATH9K_HW=y
          CONFIG_ATH9K_COMMON=y
          CONFIG_ATH9K_HTC=y
          # CARL9170 driver (packet injection)
          CONFIG_CARL9170=y
          CONFIG_CARL9170_LED=y
          # USB gadget and CDC Ethernet support for AP mode
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_RNDIS_HOST=y
          # Serial converters for wireless adapters
          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_PL2303=y
          # TUN/TAP for monitor mode and packet injection
          CONFIG_TUN=y
          # USB gadget support
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_STORAGE=y
          # Deauthentication and packet injection prerequisites
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_CFG80211_DEBUGFS=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_DEBUGFS=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_IEEE80211=y
          CONFIG_IEEE80211_DEBUGFS=y
          NETHUNTER

          # Apply NetHunter config with patched Kconfig
          make -C kernel O="$PWD/out" olddefconfig

          echo "Resolved NetHunter configuration:"
          grep -E 'CONFIG_(MAC80211|MT76x2U|MT76x0U|RT2800USB|ATH9K_HTC|CARL9170|USB_CONFIGFS_F_HID|USB_CONFIGFS_RNDIS|USB_CONFIGFS_ECM|USB_SERIAL_PL2303|WLAN)=' out/.config || true

          # Verify critical NetHunter configs are enabled
          if ! grep -q '^CONFIG_ATH9K_HTC=y' out/.config; then
            echo "ERROR: CONFIG_ATH9K_HTC not enabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_RT2800USB=y' out/.config; then
            echo "ERROR: CONFIG_RT2800USB not enabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_CARL9170=y' out/.config; then
            echo "ERROR: CONFIG_CARL9170 not enabled"
            exit 1
          fi

          # Double-check QCA is not enabled (would cause HTC conflict)
          if grep -q '^CONFIG_QCA_WIFI_HOST_CMN=y' out/.config 2>/dev/null; then
            echo "ERROR: QCA WiFi host cmn still enabled - HTC symbol conflict will occur"
            grep 'CONFIG_QCA_WIFI_HOST_CMN' out/.config
            exit 1
          fi

          echo "All required NetHunter configs validated successfully"
          echo "Building kernel..."

          make -C kernel O="$PWD/out" -j2 Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          test -f out/arch/arm64/boot/Image.gz-dtb

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Experimental NetHunter kernel for XQ-AS72 pdx206
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=pdx206
          device.name4=XQ-AS72
          supported.versions=
          supported.patchlevels=
          '; }

          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          write_boot;
          EOF

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/pdx206-nethunter-v1.zip" . \
            -x '.git/*' '.github/*' 'README*' 'LICENSE*'


      - name: Record outputs
        run: |
          sha256sum pdx206-nethunter-v1.zip \
            > pdx206-nethunter-v1.zip.sha256
          cp out/.config built-kernel.config
          git -C kernel rev-parse HEAD > kernel-source-commit.txt
          clang --version > compiler-version.txt


      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: pdx206-nethunter-v1
          path: |
            pdx206-nethunter-v1.zip
            pdx206-nethunter-v1.zip.sha256
            built-kernel.config
