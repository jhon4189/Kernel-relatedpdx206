name: Build pdx206 NetHunter kernel

on:
  workflow_dispatch: {}

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio rsync python3 zip curl git make device-tree-compiler

            - name: Resolve and fetch pinned kernel source
        run: |
          FULL_SHA="$(
            curl -fsSL \
              https://api.github.com/repos/LineageOS/android_kernel_sony_sm8250/commits/g7fc8455b2fa8 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])'
          )"

          echo "Full source revision: $FULL_SHA"
          test "${#FULL_SHA}" -eq 40

          mkdir kernel
          git -C kernel init
          git -C kernel remote add origin \
            https://github.com/LineageOS/android_kernel_sony_sm8250.git
          git -C kernel fetch --depth=1 origin "$FULL_SHA"
          git -C kernel -c advice.detachedHead=false \
            checkout --detach FETCH_HEAD


      - name: Fetch Android Clang r563880c
        run: |
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            toolchain
          git -C toolchain sparse-checkout set clang-r563880c
          test -x toolchain/clang-r563880c/bin/clang

      - name: Find pdx206 defconfig
        id: defconfig
        run: |
          DEFCONFIG="$(find kernel/arch/arm64/configs \
            -type f -name '*pdx206*defconfig' | head -n1)"

          if [ -z "$DEFCONFIG" ]; then
            echo "pdx206 defconfig was not found. Available configs:"
            find kernel/arch/arm64/configs -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Using $DEFCONFIG"
          echo "path=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      - name: Create NetHunter configuration fragment
        run: |
          cat > nethunter.config <<'EOF'
          CONFIG_MAC80211=y
          CONFIG_WLAN=y

          CONFIG_MT76_CORE=y
          CONFIG_MT76x02_LIB=y
          CONFIG_MT76x0U=y
          CONFIG_MT76x2U=y

          CONFIG_RT2X00=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_UNKNOWN=y

          CONFIG_ATH_COMMON=y
          CONFIG_ATH9K_HW=y
          CONFIG_ATH9K_COMMON=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y

          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_ECM_SUBSET=y
          CONFIG_USB_CONFIGFS_ACM=y

          CONFIG_USB_NET_DRIVERS=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_USB_NET_CDC_NCM=y
          CONFIG_USB_NET_RNDIS_HOST=y

          CONFIG_USB_SERIAL_GENERIC=y
          CONFIG_USB_SERIAL_CH341=y
          CONFIG_USB_SERIAL_PL2303=y

          CONFIG_TUN=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_LIBCOMPOSITE=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_USB_STORAGE=y
          EOF

      - name: Configure and build kernel
        env:
          DEFCONFIG: ${{ steps.defconfig.outputs.defconfig }}
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/toolchain/clang-r563880c/bin:$PATH"
          export LLVM=1
          export LLVM_IAS=1

          clang --version
          make -C kernel O="$PWD/out" "$DEFCONFIG"

          kernel/scripts/kconfig/merge_config.sh \
            -O "$PWD/out" \
            "$PWD/out/.config" \
            "$PWD/nethunter.config"

          make -C kernel O="$PWD/out" olddefconfig

          grep -E \
            'CONFIG_(MAC80211|MT76x2U|MT76x0U|RT2800USB|ATH9K_HTC|CARL9170|USB_CONFIGFS_F_HID|USB_CONFIGFS_RNDIS|USB_CONFIGFS_ECM|USB_SERIAL_PL2303)=' \
            out/.config

          make -C kernel O="$PWD/out" -j"$(nproc)" Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          test -f out/arch/arm64/boot/Image.gz-dtb

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp anykernel.sh AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/pdx206-nethunter-v1.zip" . \
            -x '.git/*' '.github/*' 'README*' 'LICENSE*'

      - name: Record outputs
        run: |
          sha256sum pdx206-nethunter-v1.zip \
            > pdx206-nethunter-v1.zip.sha256
          cp out/.config built-kernel.config

      - name: Upload kernel package
        uses: actions/upload-artifact@v4
        with:
          name: pdx206-nethunter-v1
          path: |
            pdx206-nethunter-v1.zip
            pdx206-nethunter-v1.zip.sha256
            built-kernel.config
